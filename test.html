<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TV5 Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
</head>

<body style="margin:0;background:black;">

<video id="video" controls autoplay style="width:100%;height:100vh;"></video>

<script>
async function init() {
  shaka.polyfill.installAll();

  const video = document.getElementById('video');
  const player = new shaka.Player(video);

  // 🔑 ClearKey DRM
  player.configure({
    drm: {
      clearKeys: {
        "2615129ef2c846a9bbd43a641c7303ef": "07c7f996b1734ea288641a68e1cfdc4d"
      }
    },
    streaming: {
      lowLatencyMode: true,
      jumpLargeGaps: true
    }
  });

  // ⚡ Trick: Add request filter (simulate browser)
  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['User-Agent'] = 'Mozilla/5.0';
    request.headers['Referer'] = 'https://qp-pldt-live-bpk-02-prod.akamaized.net/';
  });

  try {
    await player.load(
      "https://qp-pldt-live-bpk-02-prod.akamaized.net/bpk-tv/tv5_hd/default1/index.mpd"
    );

    video.play();
    console.log("TV5 Playing...");
  } catch (e) {
    console.error("Playback failed:", e);
    alert("Stream blocked (needs proxy or allowed domain)");
  }
}

init();
</script>

</body>
</html>
